name: Sync Repository Information

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-repos.yml'

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Sync repository information
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create a Node.js script to fetch repository information
        cat << 'EOF' > sync-repos.js
        const https = require('https');
        const fs = require('fs');
        
        // Parse repository list from README
        const readmeContent = fs.readFileSync('README.md', 'utf8');
        const repoListMatch = readmeContent.match(/<!-- Repository list for auto-sync: (.+) -->/);
        
        if (!repoListMatch) {
          console.log('No repository list found in README.md');
          process.exit(0);
        }
        
        const repos = repoListMatch[1].split(', ').map(repo => repo.trim());
        console.log('Found repositories:', repos);
        
        async function fetchRepoInfo(repo) {
          return new Promise((resolve, reject) => {
            const options = {
              hostname: 'api.github.com',
              path: `/repos/${repo}`,
              method: 'GET',
              headers: {
                'User-Agent': 'GitHub-Profile-Sync',
                'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            };
        
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                if (res.statusCode === 200) {
                  resolve(JSON.parse(data));
                } else {
                  reject(new Error(`HTTP ${res.statusCode}: ${data}`));
                }
              });
            });
        
            req.on('error', reject);
            req.end();
          });
        }
        
        function getLanguageEmoji(language) {
          const emojiMap = {
            'Rust': '🦀',
            'JavaScript': '🟨',
            'TypeScript': '🔷',
            'Python': '🐍',
            'Java': '☕',
            'C++': '⚡',
            'C': '🔧',
            'Go': '🐹',
            'HTML': '🌐',
            'CSS': '🎨'
          };
          return emojiMap[language] || '📦';
        }
        
        function getLanguageBadge(language) {
          const badges = {
            'Rust': '![Rust](https://img.shields.io/badge/Rust-000000?style=flat&logo=rust&logoColor=white)',
            'JavaScript': '![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=flat&logo=javascript&logoColor=black)',
            'TypeScript': '![TypeScript](https://img.shields.io/badge/TypeScript-007ACC?style=flat&logo=typescript&logoColor=white)',
            'Python': '![Python](https://img.shields.io/badge/Python-3776AB?style=flat&logo=python&logoColor=white)',
            'Java': '![Java](https://img.shields.io/badge/Java-ED8B00?style=flat&logo=java&logoColor=white)',
            'C++': '![C++](https://img.shields.io/badge/C++-00599C?style=flat&logo=c%2B%2B&logoColor=white)',
            'Go': '![Go](https://img.shields.io/badge/Go-00ADD8?style=flat&logo=go&logoColor=white)'
          };
          return badges[language] || `![${language}](https://img.shields.io/badge/${language}-gray?style=flat)`;
        }
        
        async function generateProjectSection() {
          let projectsSection = '## 🚀 Featured Projects\n\n';
          projectsSection += '<!-- AUTO-GENERATED-PROJECTS-START -->\n';
          projectsSection += `<!-- Repository list for auto-sync: ${repos.join(', ')} -->\n\n`;
        
          for (const repo of repos) {
            try {
              console.log(`Fetching info for ${repo}...`);
              const repoInfo = await fetchRepoInfo(repo);
              
              const emoji = getLanguageEmoji(repoInfo.language);
              const badge = repoInfo.language ? getLanguageBadge(repoInfo.language) : '';
              
              projectsSection += `### ${emoji} [${repo}](${repoInfo.html_url})\n\n`;
              
              if (badge) {
                projectsSection += `${badge}\n`;
              }
              projectsSection += `[![Stars](https://img.shields.io/github/stars/${repo}?style=social)](${repoInfo.html_url})\n\n`;
              
              if (repoInfo.description) {
                projectsSection += `${repoInfo.description}\n\n`;
              }
              
              // Add key stats
              const stats = [];
              if (repoInfo.language) stats.push(`**Language**: ${repoInfo.language}`);
              if (repoInfo.stargazers_count > 0) stats.push(`**Stars**: ${repoInfo.stargazers_count}`);
              if (repoInfo.forks_count > 0) stats.push(`**Forks**: ${repoInfo.forks_count}`);
              if (repoInfo.open_issues_count > 0) stats.push(`**Issues**: ${repoInfo.open_issues_count}`);
              
              if (stats.length > 0) {
                projectsSection += `${stats.join(' • ')}\n\n`;
              }
              
              // Add topics as tags if available
              if (repoInfo.topics && repoInfo.topics.length > 0) {
                const topicTags = repoInfo.topics.map(topic => `\`${topic}\``).join(' ');
                projectsSection += `**Topics**: ${topicTags}\n\n`;
              }
              
              projectsSection += `---\n\n`;
              
            } catch (error) {
              console.error(`Error fetching ${repo}:`, error.message);
              projectsSection += `### ${getLanguageEmoji('Unknown')} [${repo}](https://github.com/${repo})\n\n`;
              projectsSection += `*Error loading repository information*\n\n---\n\n`;
            }
          }
        
          projectsSection += '<!-- AUTO-GENERATED-PROJECTS-END -->';
          return projectsSection;
        }
        
        async function updateReadme() {
          try {
            const newProjectsSection = await generateProjectSection();
            
            // Replace the projects section in README
            const startMarker = '## 🚀 Featured Projects';
            const endMarker = '<!-- AUTO-GENERATED-PROJECTS-END -->';
            
            const startIndex = readmeContent.indexOf(startMarker);
            const endIndex = readmeContent.indexOf(endMarker) + endMarker.length;
            
            if (startIndex === -1 || endIndex === -1) {
              throw new Error('Could not find project section markers in README.md');
            }
            
            const beforeProjects = readmeContent.substring(0, startIndex);
            const afterProjects = readmeContent.substring(endIndex);
            
            const newReadme = beforeProjects + newProjectsSection + afterProjects;
            
            fs.writeFileSync('README.md', newReadme, 'utf8');
            console.log('✅ README.md updated successfully!');
            
          } catch (error) {
            console.error('❌ Error updating README:', error.message);
            process.exit(1);
          }
        }
        
        // Run the update
        updateReadme();
        EOF
        
        # Execute the script
        node sync-repos.js
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add README.md
          git commit -m "🤖 Auto-sync repository information

          - Updated project descriptions and stats
          - Synced from GitHub API on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
          echo "✅ Changes pushed successfully"
        fi
