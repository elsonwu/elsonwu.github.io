name: Sync Repository Information

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger with inputs
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync'
        type: choice
        options:
        - sync
        - add-repo
        - remove-repo
      repository:
        description: 'Repository to add/remove (format: owner/repo)'
        required: false
        type: string
      sync_after_change:
        description: 'Run sync after adding/removing repository'
        required: false
        default: true
        type: boolean
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sync-repos.yml'

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Manage repositories and sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ACTION: ${{ github.event.inputs.action || 'sync' }}
        REPOSITORY: ${{ github.event.inputs.repository }}
        SYNC_AFTER_CHANGE: ${{ github.event.inputs.sync_after_change || 'true' }}
      run: |
        # Create enhanced Node.js script with repository management
        cat << 'EOF' > manage-repos.js
        const https = require('https');
        const fs = require('fs');
        
        // Get environment variables
        const ACTION = process.env.ACTION || 'sync';
        const REPOSITORY = process.env.REPOSITORY;
        const SYNC_AFTER_CHANGE = process.env.SYNC_AFTER_CHANGE === 'true';
        
        console.log(`🔧 Action: ${ACTION}`);
        if (REPOSITORY) console.log(`📦 Repository: ${REPOSITORY}`);
        
        async function main() {
          try {
            // Parse repository list from README
            let readmeContent = fs.readFileSync('README.md', 'utf8');
            const repoListMatch = readmeContent.match(/<!-- Repository list for auto-sync: (.+) -->/);
            
            if (!repoListMatch) {
              console.error('❌ No repository list found in README.md');
              process.exit(1);
            }
            
            let repos = repoListMatch[1].split(', ').map(repo => repo.trim()).filter(repo => repo.length > 0);
            console.log('📋 Current repositories:', repos);
            
            // Validate repository format if provided
            if (REPOSITORY && !REPOSITORY.match(/^[a-zA-Z0-9._-]+\/[a-zA-Z0-9._-]+$/)) {
              console.error(`❌ Invalid repository format: ${REPOSITORY}. Expected format: owner/repo`);
              process.exit(1);
            }
            
            // Handle different actions
            let repoListChanged = false;
            switch (ACTION) {
              case 'add-repo':
                if (!REPOSITORY) {
                  console.error('❌ Repository parameter required for add-repo action');
                  process.exit(1);
                }
                if (repos.includes(REPOSITORY)) {
                  console.log(`⚠️ Repository ${REPOSITORY} is already in the list`);
                } else {
                  repos.push(REPOSITORY);
                  console.log(`✅ Added repository: ${REPOSITORY}`);
                  repoListChanged = true;
                }
                break;
                
              case 'remove-repo':
                if (!REPOSITORY) {
                  console.error('❌ Repository parameter required for remove-repo action');
                  process.exit(1);
                }
                const index = repos.indexOf(REPOSITORY);
                if (index > -1) {
                  repos.splice(index, 1);
                  console.log(`✅ Removed repository: ${REPOSITORY}`);
                  repoListChanged = true;
                } else {
                  console.log(`⚠️ Repository ${REPOSITORY} not found in the list`);
                }
                break;
                
              case 'sync':
                console.log('🔄 Running sync with current repositories...');
                break;
                
                default:
                console.error(`❌ Unknown action: ${ACTION}`);
                process.exit(1);
            }
            
            // Update repository list in README if it changed
            if (repoListChanged) {
              const newRepoList = repos.join(', ');
              const newComment = `<!-- Repository list for auto-sync: ${newRepoList} -->`;
              readmeContent = readmeContent.replace(
                /<!-- Repository list for auto-sync: (.+) -->/,
                newComment
              );
              fs.writeFileSync('README.md', readmeContent, 'utf8');
              console.log(`📝 Updated repository list: ${newRepoList}`);
            }
            
            // Only proceed with sync if requested
            if (ACTION === 'sync' || (repoListChanged && SYNC_AFTER_CHANGE)) {
              console.log('🚀 Starting repository sync...');
              await performSync(repos);
            } else {
              console.log('⏭️ Skipping sync as requested');
            }
          } catch (error) {
            console.error('❌ Error:', error.message);
            console.error('Stack trace:', error.stack);
            process.exit(1);
          }
        }        async function fetchRepoInfo(repo) {
          return new Promise((resolve, reject) => {
            const options = {
              hostname: 'api.github.com',
              path: `/repos/${repo}`,
              method: 'GET',
              headers: {
                'User-Agent': 'GitHub-Profile-Sync/1.0',
                'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            };
        
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try {
                  if (res.statusCode === 200) {
                    resolve(JSON.parse(data));
                  } else if (res.statusCode === 404) {
                    reject(new Error(`Repository ${repo} not found or not accessible`));
                  } else if (res.statusCode === 403) {
                    reject(new Error(`API rate limit exceeded or insufficient permissions for ${repo}`));
                  } else {
                    reject(new Error(`HTTP ${res.statusCode}: ${data}`));
                  }
                } catch (parseError) {
                  reject(new Error(`Failed to parse response for ${repo}: ${parseError.message}`));
                }
              });
            });
        
            req.on('error', (error) => {
              reject(new Error(`Network error fetching ${repo}: ${error.message}`));
            });
            
            req.setTimeout(10000, () => {
              req.destroy();
              reject(new Error(`Request timeout for ${repo}`));
            });
            
            req.end();
          });
        }
        
        function getLanguageEmoji(language) {
          const emojiMap = {
            'Rust': '🦀',
            'JavaScript': '🟨',
            'TypeScript': '🔷',
            'Python': '🐍',
            'Java': '☕',
            'C++': '⚡',
            'C': '🔧',
            'Go': '🐹',
            'HTML': '🌐',
            'CSS': '🎨',
            'Shell': '🐚',
            'Dockerfile': '🐳'
          };
          return emojiMap[language] || '📦';
        }
        
        function getLanguageBadge(language) {
          const badges = {
            'Rust': '![Rust](https://img.shields.io/badge/Rust-000000?style=flat&logo=rust&logoColor=white)',
            'JavaScript': '![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=flat&logo=javascript&logoColor=black)',
            'TypeScript': '![TypeScript](https://img.shields.io/badge/TypeScript-007ACC?style=flat&logo=typescript&logoColor=white)',
            'Python': '![Python](https://img.shields.io/badge/Python-3776AB?style=flat&logo=python&logoColor=white)',
            'Java': '![Java](https://img.shields.io/badge/Java-ED8B00?style=flat&logo=java&logoColor=white)',
            'C++': '![C++](https://img.shields.io/badge/C++-00599C?style=flat&logo=c%2B%2B&logoColor=white)',
            'Go': '![Go](https://img.shields.io/badge/Go-00ADD8?style=flat&logo=go&logoColor=white)',
            'Shell': '![Shell](https://img.shields.io/badge/Shell-4EAA25?style=flat&logo=gnubash&logoColor=white)'
          };
          return badges[language] || `![${language}](https://img.shields.io/badge/${language.replace(' ', '%20')}-gray?style=flat)`;
        }
        
        async function performSync(repos) {
          let projectsSection = '## 🚀 Featured Projects\n\n';
          projectsSection += '<!-- AUTO-GENERATED-PROJECTS-START -->\n';
          projectsSection += `<!-- Repository list for auto-sync: ${repos.join(', ')} -->\n\n`;
        
          for (let i = 0; i < repos.length; i++) {
            const repo = repos[i];
            try {
              console.log(`📥 Fetching info for ${repo}... (${i + 1}/${repos.length})`);
              
              // Add delay between requests to respect rate limits
              if (i > 0) {
                await new Promise(resolve => setTimeout(resolve, 1000)); // 1 second delay
              }
              
              const repoInfo = await fetchRepoInfo(repo);
              
              const emoji = getLanguageEmoji(repoInfo.language);
              const badge = repoInfo.language ? getLanguageBadge(repoInfo.language) : '';
              
              projectsSection += `### ${emoji} [${repo}](${repoInfo.html_url})\n\n`;
              
              if (badge) {
                projectsSection += `${badge}\n`;
              }
              projectsSection += `[![Stars](https://img.shields.io/github/stars/${repo}?style=social)](${repoInfo.html_url})\n\n`;
              
              if (repoInfo.description) {
                projectsSection += `${repoInfo.description}\n\n`;
              }
              
              // Add key stats
              const stats = [];
              if (repoInfo.language) stats.push(`**Language**: ${repoInfo.language}`);
              if (repoInfo.stargazers_count > 0) stats.push(`**Stars**: ${repoInfo.stargazers_count}`);
              if (repoInfo.forks_count > 0) stats.push(`**Forks**: ${repoInfo.forks_count}`);
              if (repoInfo.open_issues_count > 0) stats.push(`**Issues**: ${repoInfo.open_issues_count}`);
              
              if (stats.length > 0) {
                projectsSection += `${stats.join(' • ')}\n\n`;
              }
              
              // Add topics as tags if available
              if (repoInfo.topics && repoInfo.topics.length > 0) {
                const topicTags = repoInfo.topics.map(topic => `\`${topic}\``).join(' ');
                projectsSection += `**Topics**: ${topicTags}\n\n`;
              }
              
              projectsSection += `---\n\n`;
              
            } catch (error) {
              console.error(`❌ Error fetching ${repo}:`, error.message);
              projectsSection += `### ${getLanguageEmoji('Unknown')} [${repo}](https://github.com/${repo})\n\n`;
              projectsSection += `*Error loading repository information: ${error.message}*\n\n---\n\n`;
            }
          }
        
          projectsSection += '<!-- AUTO-GENERATED-PROJECTS-END -->';
          
          // Replace the projects section in README
          const startMarker = '## 🚀 Featured Projects';
          const endMarker = '<!-- AUTO-GENERATED-PROJECTS-END -->';
          
          let currentReadme = fs.readFileSync('README.md', 'utf8');
          const startIndex = currentReadme.indexOf(startMarker);
          const endIndex = currentReadme.indexOf(endMarker) + endMarker.length;
          
          if (startIndex === -1 || endIndex === -1) {
            throw new Error('Could not find project section markers in README.md');
          }
          
          const beforeProjects = currentReadme.substring(0, startIndex);
          const afterProjects = currentReadme.substring(endIndex);
          
          const newReadme = beforeProjects + projectsSection + afterProjects;
          
          fs.writeFileSync('README.md', newReadme, 'utf8');
          console.log('✅ README.md updated successfully!');
        }
        
        // Run the main function
        main();
        EOF
        
        # Execute the script
        node manage-repos.js
        
    - name: Commit and push changes
      env:
        ACTION: ${{ github.event.inputs.action || 'sync' }}
        REPOSITORY: ${{ github.event.inputs.repository }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet; then
          echo "No changes to commit"
        else
          git add README.md
          
          # Create different commit messages based on action
          case "$ACTION" in
            "add-repo")
              COMMIT_MSG="feat: add repository $REPOSITORY to featured projects"
              COMMIT_BODY="Add $REPOSITORY to auto-sync list and update project information."$'\n\n'"Updated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              ;;
            "remove-repo")
              COMMIT_MSG="feat: remove repository $REPOSITORY from featured projects"
              COMMIT_BODY="Remove $REPOSITORY from auto-sync list and update featured projects."$'\n\n'"Updated on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              ;;
            *)
              COMMIT_MSG="chore: auto-sync repository information"
              COMMIT_BODY="Update project data from GitHub API with latest statistics and badges."$'\n\n'"Synced on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              ;;
          esac
          
          git commit -m "$COMMIT_MSG" -m "$COMMIT_BODY"
          git push
          echo "✅ Changes pushed successfully"
        fi
